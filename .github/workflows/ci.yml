name: CI

# No `branches:` filter on pull_request is deliberate. The landing strategy
# stacks most pull requests on another unit's branch rather than on main, and a
# base filter would leave those PRs with no checks at all — silently, with no
# error to notice. The push trigger covers main so a convention that was
# bypassed shows up on the very next commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Docker is present on ubuntu-latest, which later units rely on for
      # testcontainers-backed store tests.
      - name: go test
        run: make test

  govulncheck:
    name: govulncheck
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: vulnerability scan
        run: make vulncheck

  # The console is the repository's second stack. It runs as its own job rather
  # than as a step of the Go jobs because it fails for its own reasons and a
  # contributor touching only TypeScript should not have to read a Go job's log
  # to find out.
  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: install
        run: npm ci
      # `npm test` is typecheck, then the boundary check, then vitest. The
      # boundary check runs before the suite so a contract violation reports as
      # a contract violation rather than as whichever test happened to notice.
      - name: test
        run: npm test
      - name: build
        run: npm run build

  # D19's other half. The console consumes the public API and has no private
  # endpoints, and the check is here because a principle alone does not hold —
  # a BFF grows one convenient handler at a time. The Go step is the drift
  # guard: the exported contract has to be what internal/api actually declares,
  # or the Node check would be measuring against a stale copy.
  console-contract:
    name: console contract boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: the exported contract matches the Go declaration
        run: go test ./internal/api/ -run TestConsoleContract -count=1
      - name: the contract file is unmodified by the test
        run: git diff --exit-code console/contract/public-endpoints.json
      - name: install console dependencies
        run: npm ci
        working-directory: console
      - name: the console calls nothing outside the contract
        run: npm run check:contract
        working-directory: console

  # The Verification Contract's E2E row. It is its own job and not a step of
  # `console` because it needs a browser download, and because a contrast
  # failure is a different thing to read than a unit test failure.
  #
  # It runs a real browser on purpose: U15's axe pass had to disable
  # `color-contrast` because jsdom computes no colours, so the ratios stated in
  # the stylesheets were checked by nothing until this job existed.
  e2e:
    name: e2e smoke and axe
    needs: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: install
        run: npm ci
      - name: install the browser
        run: npm run e2e:install
      - name: builder round trip, approval round trip, axe with contrast
        run: npm run e2e
      - name: upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: console/playwright-report/
          retention-days: 7

  # The Verification Contract's chart row. The assertions about what the chart
  # renders are Go tests over committed snapshots, which run in the `test` job
  # and need no helm; this job is the other half of that pin — it re-renders and
  # fails on a diff, so a chart edit cannot land with the snapshots, and
  # therefore the assertions, describing the previous chart.
  chart:
    name: helm lint and snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: lint both topologies and diff the snapshots
        run: deploy/helm/render.sh --check
      # The rendering has to be a manifest the API server would accept, which
      # helm lint does not check: it validates the chart, not the Kubernetes
      # objects. -strict rejects unknown fields, which is how a typo in a field
      # name is caught rather than silently ignored on apply.
      - name: the rendered manifests are valid Kubernetes objects
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -strict -summary -kubernetes-version 1.30.0
            deploy/helm/snapshots/all-in-one.yaml
            deploy/helm/snapshots/split.yaml

  # R11 as a merge gate and not only a release gate: the three public contract
  # specifications stay in step with the constants the code ships.
  contracts:
    name: public contract versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-contract-versions.sh

  docker:
    name: docker build
    # The image build runs the console build inside its own stage, so a console
    # failure would surface here as a confusing image failure. Gating on the
    # console jobs means it surfaces as itself first.
    needs: [govulncheck, console, console-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: stamp:ci
      # The image now boots the whole composition root, so the health check
      # needs the one operational dependency the product has. A container
      # started without a DSN is supposed to fail, and the next step asserts
      # that it does.
      - name: start postgres
        run: |
          docker network create stamp-ci-net
          docker run -d --name stamp-ci-db --network stamp-ci-net \
            -e POSTGRES_USER=stamp -e POSTGRES_PASSWORD=stamp -e POSTGRES_DB=stamp \
            postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec stamp-ci-db pg_isready -U stamp >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: refuse to start without a database
        run: |
          # Redirect rather than pipe: a pipeline's exit status is the last
          # command's, so `docker run | tee` always reports tee's success and
          # this assertion would fail no matter how the image behaved.
          if docker run --rm stamp:ci --roles=all > /tmp/stamp-nodsn.log 2>&1; then
            echo "the image started with no DSN configured" >&2
            cat /tmp/stamp-nodsn.log >&2
            exit 1
          fi
          cat /tmp/stamp-nodsn.log
          grep -q STAMP_DSN /tmp/stamp-nodsn.log

      # R51 over the real image: console serving and the API surface are
      # separate roles, and the embedded bundle is only served by the role that
      # owns it. Both directions are asserted here rather than only in Go tests
      # because the embed is a build-time fact, and a build that dropped the
      # bundle would still pass every test that does not go through the image.
      - name: the console role serves the embedded bundle, the api role does not
        run: |
          docker run -d --name stamp-ci-console --network stamp-ci-net -p 19081:8081 \
            -e STAMP_DSN='postgres://stamp:stamp@stamp-ci-db:5432/stamp?sslmode=disable' \
            -e STAMP_OIDC_ISSUER='https://idp.ci.invalid' \
            -e STAMP_OIDC_JWKS_URL='https://idp.ci.invalid/jwks' \
            -e STAMP_OIDC_AUDIENCE='stamp' \
            -e STAMP_CONSOLE_API_BASE_URL='https://engine.ci.invalid' \
            -e STAMP_CONSOLE_OIDC_CLIENT_ID='stamp-console' \
            -e STAMP_CONSOLE_OIDC_AUTHORIZATION_ENDPOINT='https://idp.ci.invalid/authorize' \
            -e STAMP_CONSOLE_OIDC_TOKEN_ENDPOINT='https://idp.ci.invalid/token' \
            stamp:ci --roles=console
          docker run -d --name stamp-ci-apionly --network stamp-ci-net -p 19082:8081 \
            -e STAMP_DSN='postgres://stamp:stamp@stamp-ci-db:5432/stamp?sslmode=disable' \
            -e STAMP_OIDC_ISSUER='https://idp.ci.invalid' \
            -e STAMP_OIDC_JWKS_URL='https://idp.ci.invalid/jwks' \
            -e STAMP_OIDC_AUDIENCE='stamp' \
            stamp:ci --roles=api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:19081/healthz >/dev/null 2>&1 \
               && curl -fsS http://localhost:19082/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          expect() {
            got=$(status "$2")
            if [ "$got" != "$1" ]; then
              echo "$2 answered $got, want $1" >&2
              docker logs stamp-ci-console >&2 || true
              exit 1
            fi
          }

          # The bundle really is in the binary: 200, and HTML.
          expect 200 http://localhost:19081/console/
          curl -fsS http://localhost:19081/console/ | grep -qi '<!doctype html>'
          # A client side deep link resolves to the shell rather than to a 404.
          expect 200 http://localhost:19081/console/inbox/decision-1
          # The configured API base address is in the document, and the policy
          # names it and the IdP and nothing else.
          curl -fsS http://localhost:19081/console/config.json | grep -q 'https://engine.ci.invalid'
          csp=$(curl -sS -D - -o /dev/null http://localhost:19081/console/ | tr -d '\r' \
                 | grep -i '^content-security-policy:')
          echo "$csp"
          echo "$csp" | grep -q "default-src 'none'"
          echo "$csp" | grep -q "connect-src 'self' https://engine.ci.invalid https://idp.ci.invalid"
          echo "$csp" | grep -q "frame-ancestors 'none'"
          if echo "$csp" | grep -q "unsafe-inline"; then
            echo "the console policy allows inline script or style" >&2; exit 1
          fi
          # R50: no request input changes what the document says.
          tampered=$(curl -fsS 'http://localhost:19081/console/config.json?apiBaseUrl=https://attacker.invalid')
          echo "$tampered" | grep -q 'https://engine.ci.invalid'
          if echo "$tampered" | grep -q 'attacker.invalid'; then
            echo "a query string reached the configuration document" >&2; exit 1
          fi

          # And the API tier serves none of it.
          expect 404 http://localhost:19082/console/
          expect 404 http://localhost:19082/console/config.json
          # while still being the API tier.
          expect 401 http://localhost:19082/policies

          docker rm -f stamp-ci-console stamp-ci-apionly >/dev/null 2>&1 || true

      - name: health check the built image
        run: |
          docker run -d --name stamp-ci --network stamp-ci-net -p 18080:8080 -p 18081:8081 \
            -e STAMP_DSN='postgres://stamp:stamp@stamp-ci-db:5432/stamp?sslmode=disable' \
            -e STAMP_OIDC_ISSUER='https://idp.ci.invalid' \
            -e STAMP_OIDC_JWKS_URL='https://idp.ci.invalid/jwks' \
            -e STAMP_OIDC_AUDIENCE='stamp' \
            stamp:ci --roles=all
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1 \
               && curl -fsS http://localhost:18081/healthz >/dev/null 2>&1; then
              echo "both surfaces answered healthz after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "healthz never responded" >&2
            docker logs stamp-ci >&2 || true
          fi
          docker rm -f stamp-ci stamp-ci-db >/dev/null 2>&1 || true
          docker network rm stamp-ci-net >/dev/null 2>&1 || true
          [ "$ok" = "1" ]
