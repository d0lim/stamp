# Not a rendering of the chart. This is the negative control for the plaintext
# secret scan: every shape the scan claims to catch, in one file, so that a
# refactor which quietly stops catching them fails a test instead of passing a
# release.
#
# The last two are the audit checkpoint signing key (R42). The binary takes the
# key as a file path and never as bytes, so both of these are shapes an operator
# would have to go out of their way to produce — which is the point: the scan
# has to fail on them rather than on the settings it happens to know the names
# of.
---
apiVersion: v1
kind: Secret
metadata:
  name: stamp-db
stringData:
  dsn: postgres://stamp:hunter2@db:5432/stamp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stamp-env
data:
  STAMP_OIDC_ISSUER: "https://idp.example"
  STAMP_MFA_CIBA_CLIENT_SECRET: "s3cr3t-in-a-configmap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stamp
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: stamp
          image: ghcr.io/d0lim/stamp:0.1.0
          args:
            - --roles=all
          env:
            - name: STAMP_DSN
              value: "postgres://stamp:hunter2@db:5432/stamp?sslmode=disable"
            # A path-shaped setting pointed at something that is not a mounted
            # Secret. The scan requires these to name a mount and nothing else,
            # because "/tmp/key.pem" is a key somebody wrote into the pod's
            # filesystem by some other means.
            - name: STAMP_AUDIT_CHECKPOINT_KEY_FILE
              value: "/tmp/stamp-signing-key.pem"
      volumes:
        # The whole reason the environment carries a path: a key that reaches
        # the pod as a chart value is a key in the manifest.
        - name: checkpoint-key
          secret:
            secretName: stamp-checkpoint-key
---
apiVersion: v1
kind: Secret
metadata:
  name: stamp-checkpoint-key
stringData:
  signing-key.pem: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEIHRhbXBlcmluZy1ldmlkZW5jZS1pcy1ub3QtYS1zZWNy
    -----END PRIVATE KEY-----
