            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: pep
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: doc-fact-sources
              mountPath: "/etc/stamp/documents/fact-sources.json"
              subPath: "fact-sources.json"
              readOnly: true
            - name: doc-idp-group-sources
              mountPath: "/etc/stamp/documents/idp-group-sources.json"
