---
# Source: stamp/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stamp
  labels:
    helm.sh/chart: stamp-0.1.0
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stamp
    stamp.dev/topology: all-in-one
# The process talks to Postgres and to the IdP. It reads nothing from the
# Kubernetes API, so it is given no token to read it with.
automountServiceAccountToken: false
---
