---
# Source: stamp/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stamp
  labels:
    helm.sh/chart: stamp-0.1.0
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stamp
    stamp.dev/topology: all-in-one
# The process talks to Postgres and to the IdP. It reads nothing from the
# Kubernetes API, so it is given no token to read it with.
automountServiceAccountToken: false
---
# Source: stamp/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: stamp-env
  labels:
    helm.sh/chart: stamp-0.1.0
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stamp
    stamp.dev/topology: all-in-one
data:
  STAMP_OIDC_ISSUER: "https://idp.example"
  STAMP_OIDC_JWKS_URL: "https://idp.example/.well-known/jwks.json"
  STAMP_OIDC_AUDIENCE: "stamp"
  STAMP_OIDC_WORKLOAD_CLIENTS: "pep-1"
  STAMP_OIDC_ALLOW_INSECURE_TRANSPORT: "false"

  STAMP_DB_MAX_CONNS: "24"
  STAMP_EGRESS_ALLOW: "https://risk.internal.example"
  STAMP_EGRESS_ALLOW_LOOPBACK: "false"
  STAMP_EGRESS_ALLOW_PRIVATE: "false"
  STAMP_FACT_ALLOW_FAIL_OPEN: "false"

  STAMP_AUDIT_FAIL_CLOSED: "true"

  STAMP_AUTHORING_MODE: "both"
  STAMP_GOVERNANCE_PROPOSER_MAY_APPROVE: "false"
  STAMP_CONSOLE_OIDC_CLIENT_ID: "stamp-console"
  STAMP_CONSOLE_OIDC_AUTHORIZATION_ENDPOINT: "https://idp.example/authorize"
  STAMP_CONSOLE_OIDC_TOKEN_ENDPOINT: "https://idp.example/token"
  STAMP_CONSOLE_ALLOW_INSECURE_TRANSPORT: "false"
---
# Source: stamp/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: stamp
  labels:
    helm.sh/chart: stamp-0.1.0
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stamp
    stamp.dev/topology: all-in-one
    app.kubernetes.io/component: all
spec:
  type: ClusterIP
  # A Service publishes exactly the surfaces its tier binds. A check tier has no
  # console port to reach even by mistake, which is the point of splitting the
  # listeners rather than the paths.
  ports:
    - name: pep
      port: 8080
      targetPort: pep
      protocol: TCP
    - name: console
      port: 8081
      targetPort: console
      protocol: TCP
  selector:
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/component: all
---
# Source: stamp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stamp
  labels:
    helm.sh/chart: stamp-0.1.0
    app.kubernetes.io/name: stamp
    app.kubernetes.io/instance: stamp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stamp
    stamp.dev/topology: all-in-one
    app.kubernetes.io/component: all
    stamp.dev/roles: "all"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stamp
      app.kubernetes.io/instance: stamp
      app.kubernetes.io/component: all
  template:
    metadata:
      labels:
        helm.sh/chart: stamp-0.1.0
        app.kubernetes.io/name: stamp
        app.kubernetes.io/instance: stamp
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: stamp
        stamp.dev/topology: all-in-one
        app.kubernetes.io/component: all
      annotations:
        checksum/config: 8631451cced223e54c4a15acfd29c07a8f7b819a4305b2f05b9819d891b42638
    spec:
      serviceAccountName: stamp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stamp
          image: "ghcr.io/d0lim/stamp:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # One image, one flag. This is the only argument that differs between
          # the all-in-one topology and the split one.
          args:
            - --roles=all
          ports:
            - name: pep
              containerPort: 8080
              protocol: TCP
            - name: console
              containerPort: 8081
              protocol: TCP
          env:
            # R42: the connection string is a credential and arrives by
            # reference. Each tier reads its own Secret, which is how per-role
            # database privileges reach the process (R39) — the grant lives on
            # the login, not in the manifest.
            - name: STAMP_DSN
              valueFrom:
                secretKeyRef:
                  name: "stamp-db"
                  key: "dsn"
            # An empty address unbinds a surface; an absent variable would bind
            # it to its default. A tier says what it does not serve.
            - name: STAMP_PEP_ADDR
              value: ":8080"
            - name: STAMP_CONSOLE_ADDR
              value: ":8081"
            - name: STAMP_CALLBACK_ADDR
              value: ""
            - name: STAMP_DB_MIGRATE
              value: "true"
            - name: STAMP_DB_APPLY_GRANTS
              value: "true"
            # STAMP_AUDIT_WRITER_ID is deliberately unset: exactly one live
            # process may hold a writer identifier, and the default derives one
            # from the pod's hostname. Setting it to a literal here would make
            # the second replica fail to boot.
          envFrom:
            - configMapRef:
                name: stamp-env
          livenessProbe:
            httpGet:
              path: /healthz
              port: pep
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: pep
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
