{{- $ctx := . -}}
{{- include "stamp.checkpointsValidated" . -}}
{{- include "stamp.callbackSurfaceValidated" . -}}
{{- $tiers := include "stamp.tiers" . | fromYamlArray -}}
{{- $cp := .Values.audit.checkpoint -}}
{{/*
The configuration documents this release has at all. Which of them reach a
given tier is decided per tier below: a document that carries only a credential
goes to the tier that spends it and to no other (R42).
*/}}
{{- $configured := dict -}}
{{- range $name, $doc := .Values.documents -}}
{{/* Names the chart does not know are refused here, by the same helper that
     maps the ones it does know to their variable. */}}
{{- $_ := include "stamp.documentEnv" $name -}}
{{- if $doc.secretName -}}
{{- $_ := set $configured $name $doc -}}
{{- end -}}
{{- end -}}
{{- range $tier := $tiers }}
{{- $records := and $cp.enabled (include "stamp.tierRecordsCheckpoints" (dict "tier" $tier)) -}}
{{- $mounted := dict -}}
{{- range $name, $doc := $configured -}}
{{- if include "stamp.tierReadsDocument" (dict "tier" $tier "document" $name) -}}
{{- $_ := set $mounted $name $doc -}}
{{- end -}}
{{- end -}}
{{- $sinkFile := and $records $cp.sink.file.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stamp.tierName" (dict "ctx" $ctx "tier" $tier) }}
  labels:
    {{- include "stamp.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: {{ $tier.name }}
    stamp.dev/roles: {{ $tier.roles | quote }}
spec:
  replicas: {{ $tier.tier.replicas }}
  selector:
    matchLabels:
      {{- include "stamp.selectorLabels" (dict "ctx" $ctx "tier" $tier) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stamp.labels" $ctx | nindent 8 }}
        app.kubernetes.io/component: {{ $tier.name }}
        {{- with $ctx.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $ctx.Template.BasePath "/configmap.yaml") $ctx | sha256sum }}
        {{- with $ctx.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $tier.tier.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "stamp.serviceAccountName" $ctx }}
      {{- with $ctx.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $ctx.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: stamp
          image: {{ include "stamp.image" $ctx | quote }}
          imagePullPolicy: {{ $ctx.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $ctx.Values.securityContext | nindent 12 }}
          # One image, one flag. This is the only argument that differs between
          # the all-in-one topology and the split one.
          args:
            - --roles={{ $tier.roles }}
          ports:
            {{- range $surface := $tier.surfaces }}
            - name: {{ $surface }}
              containerPort: {{ (index $ctx.Values.listeners $surface).port }}
              protocol: TCP
            {{- end }}
          env:
            # R42: the connection string is a credential and arrives by
            # reference. Each tier reads its own Secret, which is how per-role
            # database privileges reach the process (R39) — the grant lives on
            # the login, not in the manifest.
            - name: STAMP_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $tier.credential.secretName | quote }}
                  key: {{ $tier.credential.key | quote }}
            # An empty address unbinds a surface; an absent variable would bind
            # it to its default. A tier says what it does not serve.
            - name: STAMP_PEP_ADDR
              value: {{ include "stamp.addr" (dict "ctx" $ctx "tier" $tier "surface" "pep") | quote }}
            - name: STAMP_CONSOLE_ADDR
              value: {{ include "stamp.addr" (dict "ctx" $ctx "tier" $tier "surface" "console") | quote }}
            - name: STAMP_CALLBACK_ADDR
              value: {{ include "stamp.addr" (dict "ctx" $ctx "tier" $tier "surface" "callback") | quote }}
            - name: STAMP_DB_MIGRATE
              value: {{ $tier.migrate | quote }}
            - name: STAMP_DB_APPLY_GRANTS
              value: {{ $tier.applyGrants | quote }}
            {{- /*
              The documents this tier reads, as paths into the Secret mounts
              below. They are per-tier environment rather than ConfigMap entries
              because the two credential-bearing ones do not reach every tier —
              a variable naming a document the pod does not mount is a process
              that fails to boot.
            */}}
            {{- range $name, $doc := $mounted }}
            - name: {{ include "stamp.documentEnv" $name }}
              value: {{ include "stamp.documentPath" $doc | quote }}
            {{- end }}
            {{- if and $ctx.Values.mfa.ciba.clientSecret.secretName (include "stamp.tierIssuesChallenges" (dict "tier" $tier)) }}
            # R42 with R39: the CIBA client secret reaches the tiers that can
            # open an mfa challenge and no other. A check tier compromised
            # through the PEP surface holds no credential that could ask this
            # deployment's IdP to authenticate somebody.
            - name: STAMP_MFA_CIBA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $ctx.Values.mfa.ciba.clientSecret.secretName | quote }}
                  key: {{ $ctx.Values.mfa.ciba.clientSecret.key | quote }}
            {{- end }}
            {{- if $records }}
            # R32 and R42. The api role is the only one that registers the
            # checkpointer, so these six variables are rendered on this tier and
            # on no other — the key is mounted where it is used, and a check tier
            # compromised through the PEP surface holds no key that could sign a
            # replacement for the evidence of its own compromise.
            #
            # Every one of them is a path or a scalar. There is no variable here
            # that a key's bytes could be written into, because the binary has
            # none: a private key handed over in the environment is a key in the
            # process listing, in `docker inspect` and in the values that
            # produced this manifest.
            - name: STAMP_AUDIT_CHECKPOINT_KEY_FILE
              value: {{ include "stamp.checkpointKeyPath" $ctx | quote }}
            - name: STAMP_AUDIT_CHECKPOINT_KEY_ID
              value: {{ $cp.keyId | quote }}
            {{- if $cp.verifyKeys.keys }}
            - name: STAMP_AUDIT_CHECKPOINT_VERIFY_KEYS
              value: {{ include "stamp.checkpointVerifyKeys" $ctx | quote }}
            {{- end }}
            {{- if $sinkFile }}
            - name: STAMP_AUDIT_CHECKPOINT_SINK_FILE
              value: {{ include "stamp.checkpointSinkPath" $ctx | quote }}
            {{- end }}
            {{- with $cp.sink.webhook }}
            - name: STAMP_AUDIT_CHECKPOINT_SINK_WEBHOOK
              value: {{ . | quote }}
            {{- end }}
            {{- with $cp.interval }}
            - name: STAMP_AUDIT_CHECKPOINT_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $ctx.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # STAMP_AUDIT_WRITER_ID is deliberately unset: exactly one live
            # process may hold a writer identifier, and the default derives one
            # from the pod's hostname. Setting it to a literal here would make
            # the second replica fail to boot.
          envFrom:
            - configMapRef:
                name: {{ include "stamp.fullname" $ctx }}-env
          # /healthz is liveness and /readyz is readiness, and they are two
          # endpoints because they have two remedies. /healthz asks whether the
          # process is wedged — nothing it consults can be fixed by waiting, so
          # a failure there means restart. /readyz asks whether a request routed
          # here would work, which on this chart is mostly one question: has the
          # database reached the schema this image's queries are written against?
          # Only the api tier migrates, and `helm upgrade` rolls every Deployment
          # at once, so a decide pod can be ahead of the schema for as long as
          # the migration takes. Pointing readiness at /healthz — which is what
          # this chart used to do — put that pod in its Service answering 42703;
          # pointing liveness at /readyz would restart it instead of letting it
          # wait. A rollout that stalls here is the gate working: `kubectl
          # describe` on an unready pod prints the version it is waiting for.
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ index $tier.surfaces 0 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ index $tier.surfaces 0 }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with $tier.tier.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $mounted $records }}
          volumeMounts:
            {{- range $name, $doc := $mounted }}
            - name: {{ printf "doc-%s" (kebabcase $name) }}
              mountPath: {{ include "stamp.documentPath" $doc | quote }}
              subPath: {{ $doc.key | quote }}
              readOnly: true
            {{- end }}
            {{- if $records }}
            - name: checkpoint-key
              mountPath: {{ include "stamp.checkpointKeyPath" $ctx | quote }}
              subPath: {{ $cp.signingKey.key | quote }}
              readOnly: true
            {{- if $cp.verifyKeys.keys }}
            - name: checkpoint-verify
              mountPath: {{ include "stamp.checkpointVerifyDir" $ctx | quote }}
              readOnly: true
            {{- end }}
            {{- if $sinkFile }}
            # The one writable path in this container, and the reason
            # readOnlyRootFilesystem can stay on. The sink is append-only and
            # holds no credential — a checkpoint is a signature over public
            # chain heads — so it is the only mount here that is not a Secret
            # and not read-only.
            - name: checkpoint-sink
              mountPath: {{ include "stamp.checkpointSinkDir" $ctx | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or $mounted $records }}
      # The documents are mounted, not templated: three of the six may carry a
      # credential and none of them may appear in a manifest. The signing key is
      # mounted for the same reason and a stronger one — the chart has no field
      # its bytes could have been written into.
      #
      # Which of them this tier gets is stamp.tierReadsDocument's answer, and it
      # follows the binary: a document a tier's roles never read is a credential
      # sitting on a filesystem nothing in that pod consults.
      volumes:
        {{- range $name, $doc := $mounted }}
        - name: {{ printf "doc-%s" (kebabcase $name) }}
          secret:
            secretName: {{ $doc.secretName | quote }}
            items:
              - key: {{ $doc.key | quote }}
                path: {{ $doc.key | quote }}
        {{- end }}
        {{- if $records }}
        - name: checkpoint-key
          secret:
            secretName: {{ $cp.signingKey.secretName | quote }}
            defaultMode: 0400
            items:
              - key: {{ $cp.signingKey.key | quote }}
                path: {{ $cp.signingKey.key | quote }}
        {{- if $cp.verifyKeys.keys }}
        - name: checkpoint-verify
          secret:
            secretName: {{ $cp.verifyKeys.secretName | quote }}
            defaultMode: 0444
            items:
              {{- range $entry := $cp.verifyKeys.keys }}
              - key: {{ $entry.key | quote }}
                path: {{ $entry.key | quote }}
              {{- end }}
        {{- end }}
        {{- if $sinkFile }}
        - name: checkpoint-sink
          {{- if $cp.sink.file.volume }}
          {{- toYaml $cp.sink.file.volume | nindent 10 }}
          {{- else }}
          # An emptyDir loses the file when the pod is replaced, and the series
          # survives anyway: the repair pass at the head of each tick
          # republishes from the database every checkpoint this host's copy is
          # missing, so a restarted pod converges on the whole series rather
          # than starting a new one. Give sink.file.volume a claim if you want
          # the file itself to persist.
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with $tier.tier.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tier.tier.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tier.tier.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
