{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stamp.serviceAccountName" . }}
  labels:
    {{- include "stamp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The process talks to Postgres and to the IdP. It reads nothing from the
# Kubernetes API, so it is given no token to read it with.
automountServiceAccountToken: false
{{- end }}
