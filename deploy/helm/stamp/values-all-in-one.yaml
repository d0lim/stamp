# The all-in-one topology (R25): one Deployment, one database login, the PEP and
# console listeners on one pod. This is values.yaml plus the settings that have
# no safe default — the trust boundary and the egress allowlist.
#
# It is also the input to deploy/helm/snapshots/all-in-one.yaml, so a change
# here shows up as a diff in the rendered manifest under test.
topology: all-in-one

image:
  repository: ghcr.io/d0lim/stamp
  tag: ""

oidc:
  issuer: https://idp.example
  jwksUrl: https://idp.example/.well-known/jwks.json
  audience: stamp
  workloadClients:
    - pep-1

database:
  credentials:
    allInOne:
      secretName: stamp-db
      key: dsn

egress:
  allow:
    - https://risk.internal.example

authoring:
  mode: both

# R32 in the shape the single-container install has to hold it: the file sink is
# the only one verification can read back, and this is the deployment with no
# second system configured. The key is a Secret this release does not create.
audit:
  checkpoint:
    enabled: true
    keyId: stamp-2026-08
    signingKey:
      secretName: stamp-checkpoint-key
      key: signing-key.pem

# The configuration documents, named here so that the rendered manifest shows
# what one tier running every role reads: all six. The split topology is where
# the narrowing is visible, and this is the other side of the same rule — a tier
# whose roles include the consumer and the decide ones reads the ingest grants
# and the external targets, because it is the tier that spends them.
#
# The Secrets are the operator's; this release creates none of them.
documents:
  factSources:
    secretName: stamp-fact-sources
    key: fact-sources.json
  streamSources:
    secretName: stamp-stream-sources
    key: stream-sources.json
  ingestCredentials:
    secretName: stamp-ingest-credentials
    key: ingest-credentials.json
  externalTargets:
    secretName: stamp-external-targets
    key: external-targets.json
  idpGroupSources:
    secretName: stamp-idp-group-sources
    key: idp-group-sources.json
  kafkaTopics:
    secretName: stamp-kafka-topics
    key: kafka-topics.json

console:
  # Empty: the bundle and the API are the same origin here, which is what makes
  # this the single-container install.
  apiBaseUrl: ""
  oidc:
    clientId: stamp-console
    authorizationEndpoint: https://idp.example/authorize
    tokenEndpoint: https://idp.example/token

allInOne:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
