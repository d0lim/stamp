# The optional Kafka overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
#
# D11 put the broker behind an ingestion port so that the aggregation logic can
# be tested without one and the default demo profile can drop it entirely. The
# port earns that only if both adapters actually run, so this overlay exists and
# the quickstart asserts that the velocity deny it produces is the same one the
# broker-free profile produces.
#
# Everything that changes between the two profiles is in this file, and it is
# two environment variables: which adapter the source joins on, and the topic
# binding. No policy, no schema, no route and no client changes — which is the
# claim the port was introduced to make.

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # The topic exists before anything subscribes to it. Auto-creation would work
  # and it would make the demo's timing the thing under test: the consumer would
  # discover the topic on a metadata refresh whose deadline nobody controls.
  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic stamp.transfers --partitions 1 --replication-factor 1
        echo "stamp.transfers ready"

  stamp:
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      # The source declaration is the default profile's, with `adapter` moved
      # from the HTTP ingest adapter to the broker one. Nothing else moves.
      STAMP_STREAM_SOURCES: >-
        [{"name":"transferred_today","metric":"transfer_amount","adapter":"kafka",
          "window":"24h","bucket_width":"1h",
          "params":[{"name":"account","type":"string"}],"returns":"double","on_error":"deny"}]
      STAMP_KAFKA_BROKERS: kafka:9092
      STAMP_KAFKA_GROUP: stamp-demo
      # The Kafka path has no per-request credential to scope, so the binding an
      # HTTP ingest grant carries is a property of the topic here: the operator
      # names the caller the broker's ACLs admit as producer, and a record
      # cannot claim another producer's dedup namespace. This demo runs a
      # PLAINTEXT broker with no ACLs at all, which is exactly the arrangement
      # docs/security.md says a real deployment must not copy.
      STAMP_KAFKA_TOPICS: >-
        [{"topic":"stamp.transfers","source":"transferred_today",
          "caller_id":"workload:http://localhost:${DEMO_KEYCLOAK_PORT:-18780}/realms/stamp-demo#svc-ingest"}]
